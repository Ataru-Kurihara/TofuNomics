# TofuNomics プラグイン設定ファイル
# Minecraftサーバー「Tofu」独自経済プラグイン
#
# 設定ファイルバージョン（自動更新に使用）
config_version: "2.1"

# データベース設定
database:
  # データベースファイル名
  filename: "tofunomics_world.db"
  # データベース接続プール設定
  connection_pool:
    max_connections: 10
    timeout: 30000

# 経済システム設定
economy:
  # 通貨設定
  currency:
    name: "金塊"
    symbol: "G"
    # 小数点以下の桁数（0-2）
    decimal_places: 0
    
    # 豆腐コイン価値設定
    coin_value: 1          # 1コインの価値（デフォルト: $10）
    dynamic_value: true       # 価値変更の可否
    min_value: 1           # 最小価値制限
    max_value: 1000        # 最大価値制限
  
  # 初期残高（新規プレイヤーの開始残高）
  starting_balance: 100

  # 経済機能を有効にするワールド（ホワイトリスト方式）
  # ここに記載したワールドでのみ、経験値・報酬・コマンド・NPC等のTofuNomics機能が動作する
  # 空リストの場合は全ワールドで有効（後方互換）
  enabled_worlds:
    - "tofuNomics"

  # 送金設定
  pay:
    # 最低送金額
    minimum_amount: 1
    # 最高送金額（適切な制限値を設定）
    maximum_amount: 5000
    # 送金手数料（パーセンテージ）
    fee_percentage: 0

  # 金塊引き出し・預け入れ設定
  withdraw_deposit:
    # 一度に引き出し可能な最大金額
    max_withdraw: 10000
    # 一度に預け入れ可能な最大金額
    max_deposit: 10000
  
  # 銀行・ATMアクセス制限設定
  location_restrictions:
    # 場所制限の有効化
    enabled: true
    # アクセス可能範囲（ブロック数）
    access_range: 5
    
    # 銀行の場所（引き出し・預け入れ両方可能）
    # プレイヤーが手動でNPCを設置後、以下の形式で設定してください
    banks: []
    # 設定例:
    # banks:
    #   - world: "world_name"
    #     x: 100
    #     y: 64
    #     z: 200
    #     name: "中央銀行"
    #   - world: "world_name"
    #     x: -50
    #     y: 70
    #     z: -30
    #     name: "支店"

    # ATMの場所（引き出し・預け入れ両方可能）
    # プレイヤーが手動でATMを設置後、以下の形式で設定してください
    atms: []
    # 設定例:
    # atms:
    #   - world: "world_name"
    #     x: 0
    #     y: 65
    #     z: 0
    #     name: "商店街ATM"
    #   - world: "world_name"
    #     x: 100
    #     y: 70
    #     z: 100
    #     name: "住宅街ATM"

# 職業システム設定
jobs:
  # 職業の基本設定
  general:
    # プレイヤーが同時に持てる職業数
    max_jobs_per_player: 1
    # 転職時のレベル保持（true: 保持, false: リセット）
    keep_level_on_change: true
    # 職業変更のクールダウン時間（秒）。0で制限なし、86400で1日1回
    job_change_cooldown: 0

  
  # 職業ブロック制限システム設定
  block_restrictions:
    # ブロック制限システムの有効化
    enabled: true
    
    # 基本ブロック（全職業で採掘可能）
    basic_blocks:
      - "STONE"
      - "COBBLESTONE"
      - "DIRT"
      - "GRASS_BLOCK"
      - "SAND"
      - "GRAVEL"
      - "SANDSTONE"
      - "ANDESITE"
      - "DIORITE"
      - "GRANITE"
      - "NETHERRACK"
      - "END_STONE"
      - "OBSIDIAN"
      # 原木類（建築基本素材として無職でも採取可能）
      - "OAK_LOG"
      - "BIRCH_LOG"
      - "SPRUCE_LOG"
      - "JUNGLE_LOG"
      - "ACACIA_LOG"
      - "DARK_OAK_LOG"
    
    # 職業専用ブロック（Phase1: 鉱夫のみ実装）
    job_restricted_blocks:
      # 鉱夫専用ブロック（鉱石類）- Minecraft 1.16.5対応
      miner:
        - "COAL_ORE"
        - "IRON_ORE"
        - "GOLD_ORE"
        - "DIAMOND_ORE"
        - "EMERALD_ORE"
        - "LAPIS_ORE"
        - "REDSTONE_ORE"
        - "NETHER_QUARTZ_ORE"
        - "COPPER_ORE"

      # 木こり専用ブロック（木材類）- Minecraft 1.16.5対応
      woodcutter:
        # 葉ブロック類
        - "OAK_LEAVES"
        - "BIRCH_LEAVES"
        - "SPRUCE_LEAVES"
        - "JUNGLE_LEAVES"
        - "ACACIA_LEAVES"
        - "DARK_OAK_LEAVES"
        # キノコブロック類
        - "BROWN_MUSHROOM_BLOCK"
        - "RED_MUSHROOM_BLOCK"
        - "MUSHROOM_STEM"
      # 農家専用ブロック（農作物・畜産関連）- Minecraft 1.16.5対応
      farmer:
        # 作物ブロック（成熟状態）
        - "WHEAT"
        - "POTATOES"
        - "CARROTS"
        - "BEETROOTS"
        - "PUMPKIN"
        - "MELON"
        # 特殊農業ブロック
        - "COCOA"
        - "SUGAR_CANE"
        - "CACTUS"
        - "BROWN_MUSHROOM"
        - "RED_MUSHROOM"
        # 畜産関連ブロック
        - "HAY_BLOCK"
        - "DRIED_KELP_BLOCK"
      fisherman:
        - "WATER"
        - "KELP"
        - "SEAGRASS"
        - "SEA_PICKLE"
        - "TUBE_CORAL"
        - "BRAIN_CORAL"
        - "BUBBLE_CORAL"
        - "FIRE_CORAL"
        - "HORN_CORAL"
        - "DEAD_TUBE_CORAL"
        - "DEAD_BRAIN_CORAL"
        - "DEAD_BUBBLE_CORAL"
        - "DEAD_FIRE_CORAL"
        - "DEAD_HORN_CORAL"

      blacksmith:
        - "ANVIL"
        - "CHIPPED_ANVIL"
        - "DAMAGED_ANVIL"
        - "FURNACE"
        - "BLAST_FURNACE"
        - "SMITHING_TABLE"
        - "GRINDSTONE"
        - "CAULDRON"
        - "LAVA_CAULDRON"

      alchemist:
        - "BREWING_STAND"
        - "CAULDRON"
        - "WATER_CAULDRON"
        - "POWDER_SNOW_CAULDRON"
        - "NETHER_WART"
        - "SOUL_SAND"
        - "SOUL_SOIL"
        - "MAGMA_BLOCK"

      enchanter:
        - "ENCHANTING_TABLE"
        - "BOOKSHELF"
        - "LECTERN"
        - "LAPIS_BLOCK"

      architect:
        - "SCAFFOLDING"
        - "LADDER"
        - "CHAIN"
        - "LANTERN"
        - "SOUL_LANTERN"
        - "TORCH"
        - "SOUL_TORCH"
        - "REDSTONE_TORCH"
        - "SEA_LANTERN"
        - "GLOWSTONE"
        - "JACK_O_LANTERN"
        - "CAMPFIRE"
        - "SOUL_CAMPFIRE"

  # 各職業の設定
  job_settings:
    miner:
      display_name: "鉱夫"
      description: "鉱物資源と石材の供給を担当"
      max_level: 100
      base_income_multiplier: 1.0
