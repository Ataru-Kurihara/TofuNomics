    y: 76                  # Y座標  
    z: -247                # Z座標
    yaw: -178.8            # 水平方向の向き（-180.0 ~ 180.0、0.0=南、90.0=西、-90.0=東、180.0=北）
    pitch: -18.8           # 垂直方向の向き（-90.0 ~ 90.0、-90.0=真上、0.0=水平、90.0=真下）
