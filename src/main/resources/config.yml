# TofuNomics プラグイン設定ファイル
# Minecraftサーバー「Tofu」独自経済プラグイン
#
# 【設定ファイル分割について】
#   このファイルはサーバー固有データ（NPC座標・trading_posts・銀行/ATM位置など）を含むため、
#   デプロイ時に上書きしてはいけません（手動編集のみ）。
#   静的な設定は config/ フォルダの補助ファイルに分割されており、起動時にマージされます:
#     - config/jobs.yml     : 職業詳細・スキル・レベリング
#     - config/messages.yml : メッセージ・イベント・報酬
#     - config/gameplay.yml : ルール/UI/取引/市場 など
#     - config/system.yml   : 性能/API/土地保護/デバッグ
#   補助ファイルはサーバー固有データを含まないため、デプロイで安全に上書き可能です。
#
# 設定ファイルバージョン（自動更新に使用）
config_version: "2.1"

# データベース設定
database:
  # データベースファイル名
  filename: "tofunomics_world.db"
  # データベース接続プール設定
  connection_pool:
    max_connections: 10
    timeout: 30000

# 経済システム設定
economy:
  # 通貨設定
  currency:
    name: "金塊"
    symbol: "G"
    # 小数点以下の桁数（0-2）
    decimal_places: 0
    
    # 豆腐コイン価値設定
    coin_value: 1          # 1コインの価値（デフォルト: $10）
    dynamic_value: true       # 価値変更の可否
    min_value: 1           # 最小価値制限
    max_value: 1000        # 最大価値制限
  
  # 初期残高（新規プレイヤーの開始残高）
  starting_balance: 100

  # 経済機能を有効にするワールド（ホワイトリスト方式）
  # ここに記載したワールドでのみ、経験値・報酬・コマンド・NPC等のTofuNomics機能が動作する
  # 空リストの場合は全ワールドで有効（後方互換）
  enabled_worlds:
    - "tofuNomics"

  # 送金設定
  pay:
    # 最低送金額
    minimum_amount: 1
    # 最高送金額（適切な制限値を設定）
    maximum_amount: 5000
    # 送金手数料（パーセンテージ）
    fee_percentage: 0

  # 金塊引き出し・預け入れ設定
  withdraw_deposit:
    # 一度に引き出し可能な最大金額
    max_withdraw: 10000
    # 一度に預け入れ可能な最大金額
    max_deposit: 10000
  
  # 銀行・ATMアクセス制限設定
  location_restrictions:
    # 場所制限の有効化
    enabled: true
    # アクセス可能範囲（ブロック数）
    access_range: 5
    
    # 銀行の場所（引き出し・預け入れ両方可能）
    # プレイヤーが手動でNPCを設置後、以下の形式で設定してください
    banks: []
    # 設定例:
    # banks:
    #   - world: "world_name"
    #     x: 100
    #     y: 64
    #     z: 200
    #     name: "中央銀行"
    #   - world: "world_name"
    #     x: -50
    #     y: 70
    #     z: -30
    #     name: "支店"

    # ATMの場所（引き出し・預け入れ両方可能）
    # プレイヤーが手動でATMを設置後、以下の形式で設定してください
    atms: []

# 職業システム設定（block_restrictions のみ。職業詳細・スキル・レベリングは config/jobs.yml）
jobs:
  # 職業ブロック制限システム設定
  block_restrictions:
    # ブロック制限システムの有効化
    enabled: true
    
    # 基本ブロック（全職業で採掘可能）
    basic_blocks:
      - "STONE"
      - "COBBLESTONE"
      - "DIRT"
      - "GRASS_BLOCK"
      - "SAND"
      - "GRAVEL"
      - "SANDSTONE"
      - "ANDESITE"
      - "DIORITE"
      - "GRANITE"
      - "NETHERRACK"
      - "END_STONE"
      - "OBSIDIAN"
      # 原木類（建築基本素材として無職でも採取可能）
      - "OAK_LOG"
      - "BIRCH_LOG"
      - "SPRUCE_LOG"
      - "JUNGLE_LOG"
      - "ACACIA_LOG"
      - "DARK_OAK_LOG"
    
    # 職業専用ブロック（Phase1: 鉱夫のみ実装）
    job_restricted_blocks:
      # 鉱夫専用ブロック（鉱石類）- Minecraft 1.16.5対応
      miner:
        - "COAL_ORE"
        - "IRON_ORE"
        - "GOLD_ORE"
        - "DIAMOND_ORE"
        - "EMERALD_ORE"
        - "LAPIS_ORE"
        - "REDSTONE_ORE"
        - "NETHER_QUARTZ_ORE"
        - "COPPER_ORE"

      # 木こり専用ブロック（木材類）- Minecraft 1.16.5対応
      woodcutter:
        # 葉ブロック類
        - "OAK_LEAVES"
        - "BIRCH_LEAVES"
        - "SPRUCE_LEAVES"
        - "JUNGLE_LEAVES"
        - "ACACIA_LEAVES"
        - "DARK_OAK_LEAVES"
        # キノコブロック類
        - "BROWN_MUSHROOM_BLOCK"
        - "RED_MUSHROOM_BLOCK"
        - "MUSHROOM_STEM"
      # 農家専用ブロック（農作物・畜産関連）- Minecraft 1.16.5対応
      farmer:
        # 作物ブロック（成熟状態）
        - "WHEAT"
        - "POTATOES"
        - "CARROTS"
        - "BEETROOTS"
        - "PUMPKIN"
        - "MELON"
        # 特殊農業ブロック
        - "COCOA"
        - "SUGAR_CANE"
        - "CACTUS"
        - "BROWN_MUSHROOM"
        - "RED_MUSHROOM"
        # 畜産関連ブロック
        - "HAY_BLOCK"
        - "DRIED_KELP_BLOCK"
      fisherman:
        - "WATER"
        - "KELP"
        - "SEAGRASS"
        - "SEA_PICKLE"
        - "TUBE_CORAL"
        - "BRAIN_CORAL"
        - "BUBBLE_CORAL"
        - "FIRE_CORAL"
        - "HORN_CORAL"
        - "DEAD_TUBE_CORAL"
        - "DEAD_BRAIN_CORAL"
        - "DEAD_BUBBLE_CORAL"
        - "DEAD_FIRE_CORAL"
        - "DEAD_HORN_CORAL"

      blacksmith:
        - "ANVIL"
        - "CHIPPED_ANVIL"
        - "DAMAGED_ANVIL"
        - "FURNACE"
        - "BLAST_FURNACE"
        - "SMITHING_TABLE"
        - "GRINDSTONE"
        - "CAULDRON"
        - "LAVA_CAULDRON"

      alchemist:
        - "BREWING_STAND"
        - "CAULDRON"
        - "WATER_CAULDRON"
        - "POWDER_SNOW_CAULDRON"
        - "NETHER_WART"
        - "SOUL_SAND"
        - "SOUL_SOIL"
        - "MAGMA_BLOCK"

      enchanter:
        - "ENCHANTING_TABLE"
        - "BOOKSHELF"
        - "LECTERN"
        - "LAPIS_BLOCK"

      architect:
        - "SCAFFOLDING"
        - "LADDER"
        - "CHAIN"
        - "LANTERN"
        - "SOUL_LANTERN"
        - "TORCH"
        - "SOUL_TORCH"
        - "REDSTONE_TORCH"
        - "SEA_LANTERN"
        - "GLOWSTONE"
        - "JACK_O_LANTERN"
        - "CAMPFIRE"
        - "SOUL_CAMPFIRE"

    # 植え付け（種まき）制限（農家のみ作物を植え付け可能）
    # 注意: 装飾用フルブロック（PUMPKIN/MELON/HAY_BLOCK等）は制限対象外（誰でも設置可）
    planting_restrictions:
      # 植え付け制限システムの有効化
      enabled: true
      # 農家専用の植え付けブロック（参考。実際の判定はJava側の定義に準拠）
      farmer:
        - "WHEAT"
        - "CARROTS"
        - "POTATOES"
        - "BEETROOTS"
        - "NETHER_WART"
        - "COCOA"
        - "PUMPKIN_STEM"
        - "MELON_STEM"
        - "SUGAR_CANE"
        - "CACTUS"
        - "BAMBOO"

# NPCシステム設定
npc_system:
  # NPCシステムの有効化
  enabled: true
  
  # NPC相互作用設定
  interaction:
    # NPCとの相互作用のクールダウン（ミリ秒）
    cooldown_ms: 1000
    # 取引セッションのタイムアウト（ミリ秒）
    session_timeout_ms: 300000  # 5分
    # NPCへのアクセス範囲（ブロック）
    access_range: 5
    # セリフ表示後のGUI開封遅延（ticks）- 20 ticks = 1秒
    gui_delay_ticks: 40
    # NPCがプレイヤーの方を向くかどうか（true: 向く、false: 固定）
    look_at_player: true
  
  # 銀行NPC設定
  bank_npcs:
    # 銀行NPCシステムの有効化
    enabled: true
    
    # 銀行NPCの配置
    locations:
      - world: "tofuNomics"
        x: -200
        y: 70
        z: -100
        name: "§bATM案内係"
        type: "atm_assistant"
        yaw: 0.0    # 水平方向の向き（-180.0 〜 180.0）
        pitch: 0.0  # 垂直方向の向き（-90.0 〜 90.0）
    
    # 銀行NPCの利用制限
    limits:
      # 1回あたりの最大引き出し金額
      max_withdraw_amount: 10000.0
      # 1回あたりの最大預金金額  
      max_deposit_amount: 10000.0
    
    # 銀行NPCのメッセージ
    messages:
      greeting: "§6こんにちは、%player%さん！%npc_name%へようこそ。"
      main_bank_greeting: "§6ようこそ中央銀行へ！お金の管理はお任せください。"
      branch_greeting: "§eいらっしゃいませ！こちらは商店街支店です。"
      atm_greeting: "§bATMサービスをご利用いただけます。"
      service_hours: "§c申し訳ありませんが、営業時間外です。（営業時間: %start%:00 - %end%:00）"
  
  # 取引NPC設定
  trading_npcs:
    # 取引NPCシステムの有効化
    enabled: true
    
    # 取引時間制限
    trading_hours:
      enabled: true
      start: 6    # 6:00
      end: 22     # 22:00
    
    # 取引NPCの基本設定（詳細なメッセージはmessagesセクションで管理）
    default_messages:
      greeting: "§6いらっしゃいませ、%player%さん！%npc_name%へようこそ。"
      job_not_accepted: "§c申し訳ありませんが、あなたの職業（%job%）では当店をご利用いただけません。"
      no_job: "§c職業に就いていません。/jobs join <職業名> で職業に就いてからご利用ください。"
      outside_hours: "§c営業時間外です。営業時間: %start%:00 - %end%:00"
      detailed_trade_info: true  # 取引詳細情報の表示
  
  # 食料NPC設定
  food_npc:
    # 食料NPCシステムの有効化
    enabled: true
    
    # 営業時間制限（通常営業時間での食料供給）
    operating_hours:
      enabled: true
      start_hour: 6   # 6:00から
      end_hour: 22    # 22:00まで営業（通常営業時間）
    
    # 食料NPC配置
    locations: []
    # 食料NPC配置例:
    # - world: "world_name"
    #   x: -50
    #   y: 70
    #   z: -200
    #   name: "§6食料品商人"
    #   description: "基本的な食料品を販売"
    
    # 購入制限設定（農家依存防止）
    purchase_limits:
      enabled: true
      daily_limit_per_item: 32  # アイテムごとの1日購入上限
      reset_hour: 6             # 午前6時にリセット
    
    # 在庫システム
    inventory_system:
      enabled: true
      daily_stock_limit: 64     # アイテムごとの1日在庫上限
      restock_hour: 6           # 午前6時に在庫補充
    
    # NPCタイプ設定（専門店とオールマイティー店の分類）
    npc_types:
      general_store:    # オールマイティー店（価格1.5倍）
        name: "§6総合食料品店"
        items: ["all"]
        price_multiplier: 2  # 専門店より50%高い
      
      bakery:          # パン屋（基本価格）
        name: "§e村のパン屋"
        items: ["bread", "cookie", "cake", "pumpkin_pie"]
        price_multiplier: 1
      
      butcher:         # 肉屋（基本価格）
        name: "§c精肉店"
        items: ["cooked_beef", "cooked_porkchop", "cooked_chicken", "cooked_mutton", "cooked_rabbit"]
        price_multiplier: 1
      
      fishmonger:      # 魚屋（基本価格）
        name: "§b魚屋"
        items: ["cooked_cod", "cooked_salmon", "dried_kelp", "kelp"]
        price_multiplier: 1
      
      greengrocer:     # 八百屋（基本価格）
        name: "§a八百屋"
        items: ["carrot", "potato", "beetroot", "apple", "sweet_berries", "melon_slice", "baked_potato", "glow_berries", "melon", "golden_carrot"]
        price_multiplier: 1

      specialty:       # 特殊食品店（基本価格）
        name: "§d特産品店"
        items: ["mushroom_stew", "rabbit_stew", "suspicious_stew", "golden_apple", "honey_bottle", "chorus_fruit", "beetroot_soup"]
        price_multiplier: 1

    # 販売アイテムと価格（基本価格 - NPCタイプ別に倍率適用）
    #
    # 価格設定の基準（アイテム性能ベース）:
    #   1. 調理済み・加工食品 = 総合食料値（満腹度 + 隠し満腹度）× 0.5
    #   2. 生の栽培可能作物   = 取引所の買取価格（item_prices）× 1.5〜2
    #      → NPCで買って植え直すと収穫物が売却可能になり金策ループが成立するため、
    #        買取価格を必ず上回らせる（生産職の需要保護も兼ねる）
    #   3. 特殊効果アイテム   = クラフト原価（金塊換算）を下限とする
    #        例: 金のニンジン = 金塊8個、金のリンゴ = 金インゴット8個（買取10×8）
    #   ※ 購入価格は ceil(基本価格 × NPCタイプ倍率) で整数に切り上げられる
    #
    #   【全アイテム共通の下限】販売価格 > item_prices の買取価格 × 最大職業倍率(1.4)
    #     売却額には職業倍率がかかるが購入価格にはかからないため、この条件を割ると
    #     「NPCで購入 → 職業専用取引所で売却」の無限マネーループが成立する。
    #     FoodNPCArbitrageTest がこの条件を検証している。
    food_items:
      # 基本食料品（総合値 = 満腹度 + 隠し満腹度）
      bread: 5              # パン（5 + 6.0 = 11）
      baked_potato: 6       # ベイクドポテト（5 + 6.0 = 11／生じゃがいも + 精錬コスト）
      apple: 3              # リンゴ（4 + 2.4 = 6.4／栽培不可）

      # 調理済み肉類
      cooked_beef: 10       # 調理済み牛肉（8 + 12.8 = 20.8）
      cooked_porkchop: 10   # 調理済み豚肉（8 + 12.8 = 20.8）
      cooked_chicken: 6     # 調理済み鶏肉（6 + 7.2 = 13.2）
      cooked_mutton: 7      # 調理済み羊肉（6 + 9.6 = 15.6）
      cooked_rabbit: 5      # 焼いたウサギ肉（5 + 6.0 = 11）

      # シチュー類（ボウルが手元に残る）
      mushroom_stew: 6      # キノコシチュー（6 + 7.2 = 13.2）
      rabbit_stew: 10       # ウサギシチュー（10 + 12.0 = 22／食料性能最高クラス）
      beetroot_soup: 6      # ビートルートスープ（6 + 7.2 = 13.2）
      suspicious_stew: 6    # 怪しげなシチュー（6 + 7.2 = 13.2 + ランダム効果）

      # 緊急食料
      dried_kelp: 1         # 乾燥昆布（1 + 0.6 = 1.6／早食い）
      sweet_berries: 2      # スイートベリー（2 + 1.2 = 3.2／栽培可）

      # 魚屋用商品（生魚の買取価格 × 1.5 = 漁師の生産物を保護）
      cooked_cod: 10        # 焼いた鱈（5 + 6.0 = 11／買取7×1.4=9.8 を上回らせる）
      cooked_salmon: 12     # 焼いた鮭（6 + 9.6 = 15.6／買取8×1.4=11.2 を上回らせる）
      kelp: 1               # 昆布（1 + 0.6 = 1.6）

      # 八百屋用商品（生作物は「食料」ではなく「種」としての価値で価格設定）
      potato: 6             # じゃがいも（買取4.0 × 1.5）
      carrot: 6             # ニンジン（買取4.0 × 1.5）
      beetroot: 6           # ビートルート（買取3.0 × 2）
      melon: 6              # スイカ（ブロック）（買取4.0 × 1.5）
      melon_slice: 2        # スイカ（2 + 1.2 = 3.2）
      glow_berries: 3       # 光るベリー（2 + 1.2 = 3.2 + 光源）

      # パン屋用商品
      pumpkin_pie: 6        # パンプキンパイ（8 + 4.8 = 12.8）
      cookie: 1             # クッキー（2 + 0.4 = 2.4／食料性能は最低クラス）
      cake: 8               # ケーキ（14 + 2.8 = 16.8／設置が必要・7回に分けて食べる）

      # 特殊効果アイテム（クラフト原価が下限）
      golden_apple: 80          # 金のリンゴ（金インゴット8個 = 買取10 × 8）
      golden_carrot: 12         # 金のニンジン（6 + 14.4 = 20.4 回復効率1位／金塊8個 + ニンジン）
      milk_bucket: 10           # 牛乳入りバケツ（効果消去用／バケツは手元に残るため原価下限は適用しない）
      honey_bottle: 4           # ハチミツ入りの瓶（6 + 1.2 = 7.2 + 毒解除）
      chorus_fruit: 4           # コーラスフルーツ（4 + 2.4 = 6.4 + ランダムTP）
      # enchanted_golden_apple: バニラではクラフト不可の探索限定アイテムのため販売停止
    
    # メッセージ設定
    messages:
      greeting: "§6「夜分にすみません、%player%さん」"
      welcome: "§e「緊急時の食料でしたら、こちらで調達できますよ」"
      closed: "§c「申し訳ありません。営業時間は6:00-22:00です」"
      out_of_stock: "§e「%item%は売り切れです。明朝6時に入荷予定です」"
      daily_limit_reached: "§c「%item%は本日の購入上限に達しています」"
      purchase_success: "§a%item% x%amount%を %price% で購入しました"
      insufficient_funds: "§c残高が不足しています。必要: %required%"

  # 加工NPCシステム設定
  processing_npc:
    # 加工NPCシステムの有効化
    enabled: true
    
    # 加工料金設定
    fees:
      base_fee_per_log: 1.0        # 一般プレイヤーの加工料金（1原木あたり）
      woodcutter_fee: 0.0          # 木こりの加工料金（無料）
    
    # 制限設定
    limits:
      max_logs_per_process: 64     # 1回の加工で処理できる最大原木数
    
    # 加工NPCの配置
    locations: []
    # 設定例:
    # - world: "tofunomics"
    #   x: -150
    #   y: 70
    #   z: -150
    #   name: "§6木材加工職人"
    #   yaw: 0.0
    #   pitch: 0.0
    
    # 原木1個あたりの板材産出数（バニラ準拠: 4）
    planks_per_log: 4

    # 加工対応木材設定（原木→板材の対応）
    # ここに追記するだけで加工対応木材を増やせる（コード変更不要）
    wood_types:
      oak_log: "oak_planks"
      birch_log: "birch_planks"
      spruce_log: "spruce_planks"
      jungle_log: "jungle_planks"
      acacia_log: "acacia_planks"
      dark_oak_log: "dark_oak_planks"
      mangrove_log: "mangrove_planks"
      cherry_log: "cherry_planks"
      crimson_stem: "crimson_planks"
      warped_stem: "warped_planks"
      # 竹ブロック→竹板材（バニラ比率は1:2だが、ここでは一律planks_per_logを適用）
      bamboo_block: "bamboo_planks"
      # 樹皮を剥いだ原木も加工対応
      stripped_oak_log: "oak_planks"
      stripped_birch_log: "birch_planks"
