# 住居賃貸システム設定
housing_rental:
  # 住居賃貸システムの有効化
  enabled: true
  
  # プレイヤーあたりの最大賃貸契約数
  max_rentals_per_player: 3
  
  # 範囲選択ツール（WorldEditライク）
  selection_tool: WOODEN_AXE
  
  # 賃貸期間設定
  rental_periods:
    daily:
      enabled: true
      min_days: 1
      max_days: 30
    weekly:
      enabled: true
      multiplier: 6.5  # 週額 = 日額 × 6.5（割引）
    monthly:
      enabled: true
      multiplier: 25.0  # 月額 = 日額 × 25（割引）
  
  # WorldGuard連携
  worldguard_integration: true
  
  # TofuNomicsワールド名（ゲーム内時間の基準）
  world_name: tofuNomics
  
  # 自動期限チェック
  expire_check_interval: 3600  # 1時間毎（秒単位）
  
  # 期限前通知
  expire_notification_days: 3  # 期限3日前に通知
  
  # 都市保護設定
  city_protection:
    # 都市保護の有効化
    enabled: false
    # 親リージョン名（/housing admin createcityregionで作成）
    region_name: ""
    # 対象ワールド
    world_name: "tofuNomics"
    # 親リージョン作成時の自動フラグ設定
    parent_region_flags:
      build: deny
      block-break: deny
      interact: deny
  
  # WorldGuard賃貸リージョン設定
  worldguard_rental_regions:
    # リージョン自動設定の有効化
    auto_configure: true
    # 賃貸リージョンに自動設定するフラグ
    default_flags:
      use: allow           # ドア、ボタン、レバーの使用許可（メンバーのみ）
      chest-access: allow  # チェストアクセス許可（メンバーのみ）
      build: deny          # 建築は禁止（親の設定を継承）
      interact: allow      # インタラクション許可（メンバーのみ）
    # 親リージョンの自動設定
    auto_set_parent: true
    # デフォルトの親リージョン名（city_protection.region_nameが優先）
    default_parent_region: ""
  
  # メッセージ設定
  messages:
    list_header: "&6========= 賃貸可能物件一覧 ========="
    list_footer: "&6====================================="
    property_format: "&e#%id% &f%name% &7- 日額: &a%daily% &7/ 週額: &a%weekly% &7/ 月額: &a%monthly%"
    rent_success: "&a%property%の賃貸契約を締結しました"
    rent_failed: "&c賃貸契約に失敗しました: %reason%"
    extend_success: "&a契約を%days%日延長しました"
    cancel_success: "&a契約をキャンセルしました"
    expired_notification: "&c賃貸契約が%days%日後に期限切れになります (物件: %property%)"

# 時刻放送システム設定
time_announcement:
  # 時刻放送システムの有効化
  enabled: true
  
  # 放送間隔（Minecraft時間：分単位）
  # 60分 = Minecraftの1時間 = リアル時間の50秒
