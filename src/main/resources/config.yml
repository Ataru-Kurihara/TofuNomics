# 土地保護システム設定
land_protection:
  # WorldGuard連携
  worldguard_integration: true
  
  # 都市部での土地価格（1ブロックあたり）
  urban_land_price: 100
  
  # 土地購入制限
  max_lands_per_player: 5
  
  # 保護対象ワールド
  protected_worlds:
    - "tofuNomics"
    - "tofuNomics_nether"  
    - "tofuNomics_the_end"

# UX/UI演出設定（Minecraft 1.21対応）
# 各演出はサーバー側で個別に無効化できます（未設定時はすべて有効）
ux_enhancements:
  # /jobs list や /balancetop のクリック/ホバー可能なリッチテキスト
  clickable_messages: true
  # 職業レベルアップ時の画面中央Title演出
  levelup_title: true
  # 職業レベルアップ時のパーティクル演出
  levelup_particle: true
  # 送金受取時のActionBar通知
  pay_actionbar: true
  # 取引営業時間のBossBar表示
  trading_bossbar: true
  # GUIの枠装飾（カラーガラスペイン）
  gui_decoration: true

# スコアボード設定
scoreboard:
  # スコアボード機能の有効化
  enabled: true
  
  # デフォルト表示設定（新規プレイヤー用）
  default_enabled: true
  
  # スコアボードタイトル
  title: "&6&l★ &eTofuNomics &6&l★"
  
  # 更新間隔（秒）
  update_interval: 1

  # 職業レベルをバニラ経験値バー（画面下のレベル数字・緑バー）に反映する
  # true: 現在の職業のレベルと次レベルまでの進捗をバニラ経験値バーに表示
  # 対象ワールド外や職業なしの場合はバーを0にリセットする
  vanilla_exp_bar: true

  # スコアボード表示対象ワールド
  enabled_worlds:
    - "tofuNomics"
    - "tofunomics_nether"
    - "tofunomics_the_end"
  
