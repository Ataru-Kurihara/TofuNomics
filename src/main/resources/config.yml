# デバッグ設定
debug:
  # デバッグログの有効化（詳細なログ出力）
  enabled: true
  # NPCシステムのデバッグ
  npc_debug: false
  # メッセージシステムのデバッグ
  message_debug: false

# イベントシステム設定（フェーズ5）
events:
  # イベントシステムの有効化
  enabled: true
  
  # 除外ワールド（イベント処理を行わないワールド）
  excluded_worlds:
    - "creative_world"
    - "test_world"
  
  # 除外ゲームモード（常に除外: CREATIVE, SPECTATOR）
  excluded_game_modes:
    - "ADVENTURE"  # 必要に応じてアドベンチャーモードも除外
  
  # イベントキャッシュ設定
  caching:
    enabled: true
    # キャッシュ有効期限（ミリ秒）- 5分
    expiry_time: 300000
    # クリーンアップ間隔（ミリ秒）- 1分
    cleanup_interval: 60000
  
  # 非同期処理設定
  async_processing:
    enabled: true
    # スレッドプール数
    thread_pool_size: 2
    # バッチ処理間隔（tick）- 5秒
    batch_interval: 100
    # バッチサイズ
    max_batch_size: 50
  
  # 個別イベントハンドラ設定
  handlers:
    # 醸造イベント（調合師）
    brewing:
      enabled: true
      # 醸造台所有者追跡範囲（ブロック）
      owner_detection_range: 10
    
    # エンチャントイベント（魔術師）
    enchantment:
      enabled: true
      # ボーナスエンチャント確率調整
      bonus_enchant_rate_multiplier: 1.0
    
    # 繁殖イベント（農家）
    breeding:
      enabled: true
      # 希少動物の定義
      rare_animals:
        - "HORSE"
        - "MULE"
        - "HOGLIN"
        - "STRIDER"
        - "AXOLOTL"
    
    # 作物成長イベント（農家）
    growth:
      enabled: true
      # 作物所有者追跡範囲（ブロック）
      owner_detection_range: 50
      # 成長メッセージ表示確率
      message_display_rate: 0.3
    
    # 建築イベント（建築家）
    building:
      enabled: true
      # 建築プロジェクト追跡設定
      project_tracking:
        enabled: true
        # プロジェクト有効期限（ミリ秒）- 1時間
        expiry_time: 3600000
        # プロジェクト範囲（ブロック）
        max_range: 50
      
      # 装飾ブロック制限
      decorative_restrictions:
        enabled: true
        # 一般プレイヤーが使用可能な装飾ブロック
        allowed_for_non_builders:
          - "CARVED_PUMPKIN"
          - "JACK_O_LANTERN"
  
  # パフォーマンス最適化設定
  performance:
    # 統計収集の有効化
    statistics_enabled: true
    # デバッグモード
    debug_mode: false
    # 詳細ログ出力
    verbose_logging: false
    level_up: "&6おめでとうございます！ %job% がレベル %level% に上がりました！"

# 取引システム設定（フェーズ4）
trade_system:
  # 取引システムの有効化
  enabled: true
  
  # 取引確認の必要性
  confirmation_required: true
  
  # 全体価格倍率（すべての取引価格にかかる倍率）
  # tofunomicsワールドでは経済活性化のため価格を10%上昇
  global_price_multiplier: 1.0
  
  # 職業別価格ボーナス倍率（整数倍に統一）
  job_price_multipliers:
    # 初級職業（ボーナスなし）
    woodcutter: 1.0  # 木こりは基本価格のみ
    farmer: 1.0      # 農家は基本価格のみ
    
    # 中級職業（リリース前バランス調整: 格差縮小 1.5→1.2）
    miner: 1.2       # 鉱夫は鉱石系アイテムを20%高く買取
    fisherman: 1.2   # 漁師は魚類を20%高く買取
    architect: 1.2   # 建築家は建材を20%高く買取
    
    # 上級職業（リリース前バランス調整: 格差縮小 2.0→1.4）
    blacksmith: 1.4  # 鍛冶屋は道具・武器を40%高く買取
    alchemist: 1.4   # 錬金術師はポーション材料を40%高く買取
    enchanter: 1.4   # エンチャンターはエンチャント関連を40%高く買取
  
  # 取引履歴の保存設定
  history:
    # 履歴の最大保存期間（日数）
    max_days: 30
    # プレイヤー当たりの最大履歴件数
    max_records_per_player: 1000
    # 古い履歴の自動削除
    auto_cleanup: true
  
  # 取引制限
  limits:
    # 1日あたりの最大取引回数（適切な制限値を設定）
    max_trades_per_day: 50
    # 1回の取引での最大アイテム数
    max_items_per_trade: 2304  # チェスト満杯分
    # 1日あたりの最大取引額（適切な制限値を設定）
    max_earnings_per_day: 10000.0
  
  # チェスト設定
  chest_settings:
    # チェストの最大設置数
    max_chests_per_job: 10
    # 同一座標での重複設置防止
    prevent_duplicate_location: true
    # チェスト削除時の確認
    require_confirmation_on_remove: true
  
  # メッセージ設定
  messages:
    trade_chest_created: "&a取引チェストを設置しました。職業: %job%"
    trade_chest_removed: "&c取引チェストを削除しました。"
    trade_completed: "&a取引が完了しました。合計: %amount%金塊"
    trade_no_items: "&e買取可能なアイテムがありませんでした。"
    trade_invalid_item: "&c%item%はこのチェストでは買取できません。"
    insufficient_permission: "&cこの操作を行う権限がありません。"
    invalid_job_type: "&c無効な職業タイプです: %job%"
    chest_not_found: "&cチェストを見てコマンドを実行してください。"
    chest_already_exists: "&cこの場所には既に取引チェストが設置されています。"

# 職業別スキル詳細設定（フェーズ6）
job_skills:
  # 鉱夫のスキル設定
  miner:
    # 幸運の一撃（レベル10～）- 追加ドロップ
    fortune_strike:
      base_probability: 0.05    # 基本発動確率（5%）
      level_bonus: 0.002        # レベル毎のボーナス（0.2%）
      max_probability: 0.25     # 最大発動確率（25%）
      cooldown_seconds: 0       # クールダウンなし
      effect_multiplier: 1.5    # ドロップ量倍率
    
    # 鉱脈発見（レベル25～）- 連続採掘ボーナス
    vein_discovery:
      base_probability: 0.08
      level_bonus: 0.003
      max_probability: 0.3
      cooldown_seconds: 10
      effect_range: 3           # 効果範囲（ブロック）
    
    # 採掘の極意（レベル50～）- ツール耐久度節約
    mining_mastery:
      base_probability: 0.1
      level_bonus: 0.004
      max_probability: 0.4
      cooldown_seconds: 0
      durability_save_rate: 0.3  # 耐久度節約率（30%）

  # 木こりのスキル設定
  woodcutter:
    # 一斉伐採（レベル15～）- 木全体を伐採
    tree_feller:
      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.35
      cooldown_seconds: 30
      max_blocks: 64            # 最大伐採ブロック数
    
    # 苗木の恵み（レベル30～）- 苗木ドロップボーナス
    sapling_blessing:
      base_probability: 0.15
      level_bonus: 0.005
      max_probability: 0.5
      cooldown_seconds: 0
      bonus_drops: 1            # 追加苗木数
    
    # 森の番人（レベル45～）- 木材品質向上
    forest_guardian:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.2
      cooldown_seconds: 0
      quality_multiplier: 1.8   # 品質向上倍率

  # 農家のスキル設定
  farmer:
    # 豊穣の恵み（レベル10～）- 作物追加ドロップ
    harvest_blessing:
      base_probability: 0.12
      level_bonus: 0.004
      max_probability: 0.4
      cooldown_seconds: 0
      bonus_yield_rate: 0.5     # 追加収穫率
    
    # 双子の奇跡（レベル15～）- 動物繁殖時双子確率
    twin_miracle:
      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      effect_duration: 600      # 効果持続時間（秒）
    
    # 成長促進（レベル30～）- 作物・動物成長加速
    growth_acceleration:
      base_probability: 0.2
      level_bonus: 0.005
      max_probability: 0.6
      cooldown_seconds: 0
      acceleration_rate: 0.25   # 成長加速率（25%）
    
    # 品種改良（レベル50～）- 高品質作物・動物
    selective_breeding:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.15
      cooldown_seconds: 0
      quality_bonus: 2.0        # 品質ボーナス倍率

  # 漁師のスキル設定
  fisherman:
    # 大物釣り（レベル20～）- 大型魚釣り確率向上
    big_catch:
      base_probability: 0.08
      level_bonus: 0.003
      max_probability: 0.3
      cooldown_seconds: 0
      size_multiplier: 1.5      # サイズ倍率
    
    # 宝探し（レベル35～）- 宝物釣り確率向上
    treasure_hunter:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.2
      cooldown_seconds: 0
      treasure_rate: 1.8        # 宝物確率倍率
    
    # 海の加護（レベル50～）- 天候無視釣り
    sea_blessing:
      base_probability: 1.0     # 常時発動
      level_bonus: 0.0
      max_probability: 1.0
      cooldown_seconds: 0
      weather_immunity: true    # 天候影響無効

  # 鍛冶屋のスキル設定  
  blacksmith:
    # 完璧な修理（レベル10～）- 修理時耐久度ボーナス
    perfect_repair:
      base_probability: 0.15
      level_bonus: 0.005
      max_probability: 0.5
      cooldown_seconds: 0
      durability_bonus: 0.2     # 耐久度ボーナス（20%）
    
    # 名工の技（レベル25～）- 製作時品質向上
    master_craftsmanship:
      base_probability: 0.1
      level_bonus: 0.004
      max_probability: 0.35
      cooldown_seconds: 0
      quality_improvement: 1.5  # 品質向上倍率
    
    # 神器創造（レベル60～）- 特別エンチャント付与
    artifact_creation:
      base_probability: 0.02
      level_bonus: 0.001
      max_probability: 0.08
      cooldown_seconds: 300     # 5分クールダウン
      special_enchant_rate: 1.0 # 特殊エンチャント確率

  # 錬金術師のスキル設定
  alchemist:
    # 材料節約（レベル15～）- 醸造材料消費削減
    ingredient_conservation:
      base_probability: 0.2
      level_bonus: 0.006
      max_probability: 0.6
      cooldown_seconds: 0
      save_rate: 0.5            # 材料節約率（50%）
    
    # 二重醸造（レベル30～）- ポーション2個作成
    double_brewing:
      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      extra_potions: 1          # 追加ポーション数
    
    # 錬金の極意（レベル50～）- 効果時間延長
    alchemy_mastery:
      base_probability: 0.15
      level_bonus: 0.004
      max_probability: 0.4
      cooldown_seconds: 0
      duration_multiplier: 1.5  # 効果時間倍率

  # 魔術師のスキル設定
  enchanter:
    # 経験値節約（レベル10～）- エンチャント経験値コスト削減
    experience_conservation:
      base_probability: 0.25
      level_bonus: 0.008
      max_probability: 0.7
      cooldown_seconds: 0
      cost_reduction: 0.3       # コスト削減率（30%）
    
    # ボーナスエンチャント（レベル25～）- 追加エンチャント付与
    bonus_enchantment:
      base_probability: 0.08
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      bonus_levels: 1           # 追加エンチャントレベル
    
    # 魔術の神秘（レベル45～）- 希少エンチャント確率向上
    mystical_arts:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.15
      cooldown_seconds: 0
      rare_enchant_rate: 2.0    # 希少エンチャント確率倍率

  # 建築家のスキル設定
  architect:
    # 材料節約（レベル10～）- 建築材料消費削減
    material_efficiency:
      base_probability: 0.15
      level_bonus: 0.005
      max_probability: 0.45
      cooldown_seconds: 0
      material_save_rate: 0.25  # 材料節約率（25%）
    
    # 建築の美学（レベル30～）- 装飾ブロックボーナス
    architectural_aesthetics:
      base_probability: 0.2
      level_bonus: 0.006
      max_probability: 0.6
      cooldown_seconds: 0
      aesthetic_bonus: 1.5      # 美観ボーナス倍率
    
    # 巨匠の設計（レベル50～）- 大規模建築ボーナス
    master_architect:
      base_probability: 1.0     # プロジェクト規模による
      level_bonus: 0.0
      max_probability: 1.0
      cooldown_seconds: 0
      scale_bonus_threshold: 100 # ボーナス発動最小ブロック数

# レベルアップシステム設定（フェーズ6）
leveling:
  # 経験値計算設定
  experience:
    # 必要経験値計算式: base_multiplier * ((level - 1) ^ exponent)
    base_multiplier: 100
    # リリース前バランス調整: 旧2.2(ハードコード) → 1.9 に緩和しLv100到達を現実的に
    exponent: 1.9

    # 高レベル時の経験値獲得ペナルティ（実効 = max(minimum, 1.0 - level * factor)）
    # リリース前バランス調整: factor 0.01→0.005, minimum 0.1→0.4 に緩和
    level_penalty:
      factor: 0.005
      minimum: 0.4

    # 注意: 下記 level_scaling は現行実装（ExperienceManager）では未使用
    
    # レベル毎の経験値上昇率調整
    level_scaling:
      # レベル1-10: 標準成長
      early_levels:
        min_level: 1
        max_level: 10
        multiplier: 1.0
      
      # レベル11-25: やや加速
      mid_levels:
        min_level: 11
        max_level: 25
        multiplier: 0.9
      
      # レベル26-50: 標準成長に戻る
      advanced_levels:
        min_level: 26
        max_level: 50
        multiplier: 1.0
      
      # レベル51-75: 大幅に必要経験値増加
      master_levels:
        min_level: 51
        max_level: 100
        multiplier: 1.5

  # レベルアップ報酬設定
  rewards:
    # 基本報酬（全職業共通）
    base_rewards:
      # 金塊報酬（レベル * multiplier）
      money:
        enabled: true
        base_amount: 50.0
        level_multiplier: 2.5
        max_amount: 500.0
      
      # スキルポイント（特定レベルで付与）
      skill_points:
        enabled: true
        levels: [10, 25, 50, 75]
        points_per_level: 1
    
    # 職業別特別報酬
    job_specific_rewards:
      # マイルストーン報酬（特定レベル到達時）
      milestone_rewards:
        level_10:
          all_jobs:
            - type: "money"
              amount: 200.0
            - type: "message"
              text: "初級職人になりました！"
        
        level_25:
          all_jobs:
            - type: "money"
              amount: 500.0
            - type: "message"
              text: "中級職人になりました！"
          miner:
            - type: "item"
              material: "DIAMOND_PICKAXE"
              enchantments: ["EFFICIENCY:3", "UNBREAKING:2"]
          woodcutter:
            - type: "item"
              material: "DIAMOND_AXE"
              enchantments: ["EFFICIENCY:3", "UNBREAKING:2"]
        
        level_50:
          all_jobs:
            - type: "money"
              amount: 1000.0
            - type: "message"
              text: "上級職人になりました！"
        
        level_75:
          all_jobs:
            - type: "money"
              amount: 2000.0
            - type: "message"
              text: "マスター職人になりました！"

# イベント報酬バランス設定（フェーズ6）
event_rewards:
  # 全体報酬倍率設定
  global_multipliers:
    # 経験値獲得倍率（tofunomicsワールドで成長促進）
    experience_multiplier: 1.2
    # 金塊獲得倍率（tofunomicsワールドで収入増加）
    income_multiplier: 1.1
    # スキル発動確率倍率
    skill_probability_multiplier: 1.0
    
    # 時間帯別ボーナス
    time_bonuses:
      # 朝（1000-5000 tick）
      morning:
        experience_bonus: 0.05  # 5%ボーナス
        income_bonus: 0.05
      
      # 昼（5000-12000 tick）
      day:
        experience_bonus: 0.0   # ボーナスなし
        income_bonus: 0.0
      
      # 夜（12000-18000 tick）
      evening:
        experience_bonus: 0.1   # 10%ボーナス
        income_bonus: 0.05
      
      # 深夜（18000-24000 tick）
      night:
        experience_bonus: 0.15  # 15%ボーナス
        income_bonus: 0.1
    
    # 天候ボーナス
    weather_bonuses:
      # 雨天時
      rain:
        experience_bonus: 0.15  # 15%ボーナス
        income_bonus: 0.1
      
      # 雷雨時
      thunderstorm:
        experience_bonus: 0.2   # 20%ボーナス
        income_bonus: 0.15

  # 個別イベント報酬設定
  individual_events:
    # ブロック破壊イベント
    block_break:
      base_experience: 1.0
      base_income: 1.5
      # レベル連動ボーナス（レベル * multiplier）
      level_experience_bonus: 0.02
      level_income_bonus: 0.03
      
      # ツール別ボーナス
      tool_bonuses:
        enchanted_tools:
          efficiency:
            level_1: 0.1      # 10%ボーナス
            level_2: 0.15
            level_3: 0.2
            level_4: 0.25
            level_5: 0.3
          
          fortune:
            level_1: 0.2      # 20%ボーナス
            level_2: 0.35
            level_3: 0.5
        
        # ダイヤモンドツール使用時
        diamond_tools:
          experience_bonus: 0.1   # 10%ボーナス
          income_bonus: 0.05
    
    # ブロック設置イベント（建築家）
    block_place:
      base_experience: 0.5
      base_income: 0.8
      level_experience_bonus: 0.015
      level_income_bonus: 0.02
      
      # 建築プロジェクトボーナス
      project_bonuses:
        small_project:    # 20-49ブロック
          threshold: 20
          experience_multiplier: 1.2
          income_multiplier: 1.1
        
        medium_project:   # 50-99ブロック
          threshold: 50
          experience_multiplier: 1.5
          income_multiplier: 1.3
        
        large_project:    # 100+ブロック
          threshold: 100
          experience_multiplier: 2.0
          income_multiplier: 1.6
    
    # 釣りイベント
    fishing:
      base_experience: 3.0
      base_income: 4.0
      level_experience_bonus: 0.05
      level_income_bonus: 0.08
      
      # 魚種別ボーナス
      fish_bonuses:
        cod:
          experience_multiplier: 1.0
          income_multiplier: 1.0
        salmon:
          experience_multiplier: 1.2
          income_multiplier: 1.3
        tropical_fish:
          experience_multiplier: 1.5
          income_multiplier: 1.8
        pufferfish:
          experience_multiplier: 2.0
          income_multiplier: 2.2
      
      # 宝物釣りボーナス
      treasure_bonuses:
        enchanted_book:
          experience_multiplier: 3.0
          income_multiplier: 5.0
        name_tag:
          experience_multiplier: 2.5
          income_multiplier: 4.0
    
    # クラフトイベント
    crafting:
      base_experience: 2.0
      base_income: 2.5
      level_experience_bonus: 0.03
      level_income_bonus: 0.04
      
      # アイテム複雑度ボーナス
      complexity_bonuses:
        simple_items:     # 基本材料のみ
          experience_multiplier: 1.0
          income_multiplier: 1.0
        
        intermediate_items:  # 中間材料使用
          experience_multiplier: 1.3
          income_multiplier: 1.2
        
        complex_items:    # 複雑な材料組み合わせ
          experience_multiplier: 1.8
          income_multiplier: 1.5

# パフォーマンス最適化設定（フェーズ6）
performance:
  # データベース最適化
  database:
    # コネクションプール設定（HikariCP）
    connection_pool:
      enabled: true
      maximum_pool_size: 15
      minimum_idle: 3
      connection_timeout: 30000    # 30秒
      idle_timeout: 600000         # 10分
      max_lifetime: 1800000        # 30分
      leak_detection_threshold: 60000  # 1分
    
    # バッチ処理最適化
    batch_processing:
      enabled: true
      batch_size: 100              # バッチサイズ
      batch_timeout: 5000          # 5秒でタイムアウト
      max_queue_size: 1000         # 最大キューサイズ
    
    # データベースクリーンアップ
    cleanup:
      enabled: true
      cleanup_interval: 3600       # 1時間毎
      old_data_threshold_days: 30  # 30日以上古いデータを削除

  # メモリキャッシュ設定
  caching:
    # プレイヤーデータキャッシュ
    player_cache:
      enabled: true
      max_size: 1000               # 最大キャッシュサイズ
      expire_after_access: 1800    # アクセス後30分で期限切れ
      expire_after_write: 3600     # 書き込み後1時間で期限切れ
    
    # 職業データキャッシュ
    job_cache:
      enabled: true
      max_size: 500
      expire_after_access: 3600    # 1時間
      expire_after_write: 7200     # 2時間
    
    # 設定キャッシュ
    config_cache:
      enabled: true
      max_size: 200
      expire_after_access: 7200    # 2時間
      expire_after_write: 14400    # 4時間

  # ガベージコレクション最適化
  memory_management:
    # オブジェクトプール使用
    object_pooling:
      enabled: true
      pool_sizes:
        string_builder: 50
        location_objects: 100
        event_objects: 200
    
    # メモリ監視
    memory_monitoring:
      enabled: true
      warning_threshold: 0.8       # 80%でワーニング
      critical_threshold: 0.95     # 95%でクリティカル
      gc_suggestion_threshold: 0.85 # 85%でGC実行提案

  # 統計・監視設定
  monitoring:
    # パフォーマンス統計収集
    statistics:
      enabled: true
      collection_interval: 300    # 5分毎に統計収集
      retention_days: 7           # 7日間統計保持
    
    # リアルタイム監視
    realtime_monitoring:
      enabled: true
      cpu_threshold: 80.0         # CPU使用率80%で警告
      memory_threshold: 85.0      # メモリ使用率85%で警告
      tps_threshold: 18.0         # TPS 18以下で警告
    
    # アラート設定
    alerts:
      enabled: true
      discord_webhook: ""         # Discord Webhook URL
      admin_notification: true    # 管理者への通知

# プレイヤー参加時の設定
player_join:
  
