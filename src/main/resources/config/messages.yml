# イベント報酬バランス設定（フェーズ6）
event_rewards:
  # 全体報酬倍率設定
  global_multipliers:
    # 経験値獲得倍率（tofunomicsワールドで成長促進）
    experience_multiplier: 1.2
    # 金塊獲得倍率（tofunomicsワールドで収入増加）
    income_multiplier: 1.1
    # スキル発動確率倍率
    skill_probability_multiplier: 1.0
    
    # 時間帯別ボーナス
    time_bonuses:
      # 朝（1000-5000 tick）
      morning:
        experience_bonus: 0.05  # 5%ボーナス
        income_bonus: 0.05
      
      # 昼（5000-12000 tick）
      day:
        experience_bonus: 0.0   # ボーナスなし
        income_bonus: 0.0
      
      # 夜（12000-18000 tick）
      evening:
        experience_bonus: 0.1   # 10%ボーナス
        income_bonus: 0.05
      
      # 深夜（18000-24000 tick）
      night:
        experience_bonus: 0.15  # 15%ボーナス
        income_bonus: 0.1
    
    # 天候ボーナス
    weather_bonuses:
      # 雨天時
      rain:
        experience_bonus: 0.15  # 15%ボーナス
        income_bonus: 0.1
      
      # 雷雨時
      thunderstorm:
        experience_bonus: 0.2   # 20%ボーナス
        income_bonus: 0.15

  # 個別イベント報酬設定
  individual_events:
    # ブロック破壊イベント
    block_break:
      base_experience: 1.0
      base_income: 1.5
      # レベル連動ボーナス（レベル * multiplier）
      level_experience_bonus: 0.02
      level_income_bonus: 0.03
      
      # ツール別ボーナス
      tool_bonuses:
        enchanted_tools:
          efficiency:
            level_1: 0.1      # 10%ボーナス
            level_2: 0.15
            level_3: 0.2
            level_4: 0.25
            level_5: 0.3
          
          fortune:
            level_1: 0.2      # 20%ボーナス
            level_2: 0.35
            level_3: 0.5
        
        # ダイヤモンドツール使用時
        diamond_tools:
          experience_bonus: 0.1   # 10%ボーナス
          income_bonus: 0.05
    
    # ブロック設置イベント（建築家）
    block_place:
      base_experience: 0.5
      base_income: 0.8
      level_experience_bonus: 0.015
      level_income_bonus: 0.02
      
      # 建築プロジェクトボーナス
      project_bonuses:
        small_project:    # 20-49ブロック
          threshold: 20
          experience_multiplier: 1.2
          income_multiplier: 1.1
        
        medium_project:   # 50-99ブロック
          threshold: 50
          experience_multiplier: 1.5
          income_multiplier: 1.3
        
        large_project:    # 100+ブロック
          threshold: 100
          experience_multiplier: 2.0
          income_multiplier: 1.6
    
    # 釣りイベント
    fishing:
      base_experience: 3.0
      base_income: 4.0
      level_experience_bonus: 0.05
      level_income_bonus: 0.08
      
      # 魚種別ボーナス
      fish_bonuses:
        cod:
          experience_multiplier: 1.0
          income_multiplier: 1.0
        salmon:
          experience_multiplier: 1.2
          income_multiplier: 1.3
        tropical_fish:
          experience_multiplier: 1.5
          income_multiplier: 1.8
        pufferfish:
          experience_multiplier: 2.0
          income_multiplier: 2.2
      
      # 宝物釣りボーナス
      treasure_bonuses:
        enchanted_book:
          experience_multiplier: 3.0
          income_multiplier: 5.0
        name_tag:
          experience_multiplier: 2.5
          income_multiplier: 4.0
    
    # クラフトイベント
    crafting:
      base_experience: 2.0
      base_income: 2.5
      level_experience_bonus: 0.03
      level_income_bonus: 0.04
      
      # アイテム複雑度ボーナス
      complexity_bonuses:
        simple_items:     # 基本材料のみ
          experience_multiplier: 1.0
          income_multiplier: 1.0
        
        intermediate_items:  # 中間材料使用
          experience_multiplier: 1.3
          income_multiplier: 1.2
        
        complex_items:    # 複雑な材料組み合わせ
          experience_multiplier: 1.8
          income_multiplier: 1.5

# イベントシステム設定（フェーズ5）
events:
  # イベントシステムの有効化
  enabled: true
  
  # 除外ワールド（イベント処理を行わないワールド）
  excluded_worlds:
    - "creative_world"
    - "test_world"
  
  # 除外ゲームモード（常に除外: CREATIVE, SPECTATOR）
  excluded_game_modes:
    - "ADVENTURE"  # 必要に応じてアドベンチャーモードも除外
  
  # イベントキャッシュ設定
  caching:
    enabled: true
    # キャッシュ有効期限（ミリ秒）- 5分
    expiry_time: 300000
    # クリーンアップ間隔（ミリ秒）- 1分
    cleanup_interval: 60000
  
  # 非同期処理設定
  async_processing:
    enabled: true
    # スレッドプール数
    thread_pool_size: 2
    # バッチ処理間隔（tick）- 5秒
    batch_interval: 100
    # バッチサイズ
    max_batch_size: 50
  
  # 個別イベントハンドラ設定
  handlers:
    # 醸造イベント（調合師）
    brewing:
      enabled: true
      # 醸造台所有者追跡範囲（ブロック）
      owner_detection_range: 10
    
    # エンチャントイベント（魔術師）
    enchantment:
      enabled: true
      # ボーナスエンチャント確率調整
      bonus_enchant_rate_multiplier: 1.0
    
    # 繁殖イベント（農家）
    breeding:
      enabled: true
      # 希少動物の定義
      rare_animals:
        - "HORSE"
        - "MULE"
        - "HOGLIN"
        - "STRIDER"
        - "AXOLOTL"
    
    # 作物成長イベント（農家）
    growth:
      enabled: true
      # 作物所有者追跡範囲（ブロック）
      owner_detection_range: 50
      # 成長メッセージ表示確率
      message_display_rate: 0.3
    
    # 建築イベント（建築家）
    building:
      enabled: true
      # 建築プロジェクト追跡設定
      project_tracking:
        enabled: true
        # プロジェクト有効期限（ミリ秒）- 1時間
        expiry_time: 3600000
        # プロジェクト範囲（ブロック）
        max_range: 50
      
      # 装飾ブロック制限
      decorative_restrictions:
        enabled: true
        # 一般プレイヤーが使用可能な装飾ブロック
        allowed_for_non_builders:
          - "CARVED_PUMPKIN"
          - "JACK_O_LANTERN"
  
  # パフォーマンス最適化設定
  performance:
    # 統計収集の有効化
    statistics_enabled: true
    # デバッグモード
    debug_mode: false
    # 詳細ログ出力
    verbose_logging: false
    level_up: "&6おめでとうございます！ %job% がレベル %level% に上がりました！"

# 時刻放送システム設定
time_announcement:
  # 時刻放送システムの有効化
  enabled: true
  
  # 放送間隔（Minecraft時間：分単位）
  # 60分 = Minecraftの1時間 = リアル時間の50秒
  interval_minutes: 60
  
  # 取引開始・終了時刻に特別メッセージを送信
  announce_trading_hours: true
  
  # 放送メッセージ
  messages:
    # 通常の時刻放送（%time%：現在時刻、%trading_status%：営業中/閉店中）
    regular: "&e[時報] &f現在時刻：%time% &7- 取引所：%trading_status%"
    
    # 取引所開店メッセージ（6:00）
    trading_open: "&a🌅 &6[お知らせ] &aおはようございます！取引所が開店しました（営業時間：6:00-22:00）"
    
    # 取引所閉店メッセージ（22:00）
    trading_close: "&c🌙 &6[お知らせ] &c取引所は閉店しました。また明日お越しください（営業時間：6:00-22:00）"
    
    # 取引所閉店1時間前の警告（21:00）
    trading_close_warning: "&e⚠ &6[お知らせ] &e取引所は1時間後に閉店します。お早めにお取引ください"
    
    # 営業中表示
    status_open: "&a営業中"
    
    # 閉店中表示
    status_closed: "&c閉店中"
