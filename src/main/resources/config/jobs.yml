      level_bonus: 0.005
      max_probability: 0.5
      cooldown_seconds: 0
      durability_bonus: 0.2     # 耐久度ボーナス（20%）
    
    # 名工の技（レベル25～）- 製作時品質向上
    master_craftsmanship:
      base_probability: 0.1
      level_bonus: 0.004
      max_probability: 0.35
      cooldown_seconds: 0
      quality_improvement: 1.5  # 品質向上倍率
    
    # 神器創造（レベル60～）- 特別エンチャント付与
    artifact_creation:
      base_probability: 0.02
      level_bonus: 0.001
      max_probability: 0.08
      cooldown_seconds: 300     # 5分クールダウン
      special_enchant_rate: 1.0 # 特殊エンチャント確率

  # 錬金術師のスキル設定
  alchemist:
    # 材料節約（レベル15～）- 醸造材料消費削減
    ingredient_conservation:
      base_probability: 0.2
      level_bonus: 0.006
      max_probability: 0.6
      cooldown_seconds: 0
      save_rate: 0.5            # 材料節約率（50%）
    
    # 二重醸造（レベル30～）- ポーション2個作成
    double_brewing:
      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      extra_potions: 1          # 追加ポーション数
    
    # 錬金の極意（レベル50～）- 効果時間延長
    alchemy_mastery:
      base_probability: 0.15
      level_bonus: 0.004
      max_probability: 0.4
      cooldown_seconds: 0
      duration_multiplier: 1.5  # 効果時間倍率

  # 魔術師のスキル設定
  enchanter:
    # 経験値節約（レベル10～）- エンチャント経験値コスト削減
    experience_conservation:
      base_probability: 0.25
      level_bonus: 0.008
      max_probability: 0.7
      cooldown_seconds: 0
      cost_reduction: 0.3       # コスト削減率（30%）
    
    # ボーナスエンチャント（レベル25～）- 追加エンチャント付与
    bonus_enchantment:
      base_probability: 0.08
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      bonus_levels: 1           # 追加エンチャントレベル
    
    # 魔術の神秘（レベル45～）- 希少エンチャント確率向上
    mystical_arts:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.15
      cooldown_seconds: 0
      rare_enchant_rate: 2.0    # 希少エンチャント確率倍率

  # 建築家のスキル設定
  architect:
    # 材料節約（レベル10～）- 建築材料消費削減
    material_efficiency:
      base_probability: 0.15
      level_bonus: 0.005
      max_probability: 0.45
      cooldown_seconds: 0
      material_save_rate: 0.25  # 材料節約率（25%）
    
    # 建築の美学（レベル30～）- 装飾ブロックボーナス
    architectural_aesthetics:
      base_probability: 0.2
      level_bonus: 0.006
      max_probability: 0.6
      cooldown_seconds: 0
      aesthetic_bonus: 1.5      # 美観ボーナス倍率
    
    # 巨匠の設計（レベル50～）- 大規模建築ボーナス
    master_architect:
      base_probability: 1.0     # プロジェクト規模による
      level_bonus: 0.0
      max_probability: 1.0
      cooldown_seconds: 0
      scale_bonus_threshold: 100 # ボーナス発動最小ブロック数

# レベルアップシステム設定（フェーズ6）
leveling:
  # 経験値計算設定
  experience:
    # 必要経験値計算式: base_multiplier * ((level - 1) ^ exponent)
    # バランス調整(案1): 100→80。全体の必要経験値を約20%緩和しレベルを上げやすく
    base_multiplier: 80
    # バランス調整(案1): 1.9→1.7。高レベルの必要経験値の急騰を緩和
    exponent: 1.7

    # 高レベル時の経験値獲得ペナルティ（実効 = max(minimum, 1.0 - level * factor)）
    # リリース前バランス調整: factor 0.01→0.005, minimum 0.1→0.4 に緩和
    level_penalty:
      factor: 0.005
      minimum: 0.4

    # 注意: 下記 level_scaling は現行実装（ExperienceManager）では未使用
    
    # レベル毎の経験値上昇率調整
    level_scaling:
      # レベル1-10: 標準成長
      early_levels:
        min_level: 1
        max_level: 10
        multiplier: 1.0
      
      # レベル11-25: やや加速
      mid_levels:
        min_level: 11
        max_level: 25
        multiplier: 0.9
      
      # レベル26-50: 標準成長に戻る
      advanced_levels:
        min_level: 26
        max_level: 50
        multiplier: 1.0
      
      # レベル51-75: 大幅に必要経験値増加
      master_levels:
        min_level: 51
        max_level: 75
        multiplier: 1.5

  # レベルアップ報酬設定
  # 注意: 下記 rewards は現行実装（JobLevelRewardManager）では未使用。
  #       実際の報酬は「5レベルごとに 職業別基礎額 × (レベル/5) 金塊」で、
  #       基礎額は JobLevelRewardManager.JOB_BASE_REWARD にハードコードされている
  #       （鉱夫/木こり/農家 40、釣り人 35、鍛冶屋/建築家 45、錬金術師/エンチャンター 50）。
  rewards:
    # 基本報酬（全職業共通）
    base_rewards:
      # 金塊報酬（レベル * multiplier）
      money:
        enabled: true
        base_amount: 50.0
        level_multiplier: 2.5
        max_amount: 500.0
      
      # スキルポイント（特定レベルで付与）
      skill_points:
        enabled: true
        levels: [10, 25, 50, 75]
        points_per_level: 1
    
    # 職業別特別報酬
    job_specific_rewards:
      # マイルストーン報酬（特定レベル到達時）
      milestone_rewards:
        level_10:
          all_jobs:
            - type: "money"
              amount: 200.0
            - type: "message"
              text: "初級職人になりました！"
        
        level_25:
          all_jobs:
            - type: "money"
              amount: 500.0
            - type: "message"
              text: "中級職人になりました！"
          miner:
            - type: "item"
              material: "DIAMOND_PICKAXE"
              enchantments: ["EFFICIENCY:3", "UNBREAKING:2"]
          woodcutter:
            - type: "item"
              material: "DIAMOND_AXE"
              enchantments: ["EFFICIENCY:3", "UNBREAKING:2"]
        
        level_50:
          all_jobs:
            - type: "money"
              amount: 1000.0
            - type: "message"
              text: "上級職人になりました！"
        
        level_75:
          all_jobs:
            - type: "money"
              amount: 2000.0
            - type: "message"
              text: "マスター職人になりました！"
