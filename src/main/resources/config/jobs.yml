      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.35
      cooldown_seconds: 30
      max_blocks: 64            # 最大伐採ブロック数
    
    # 苗木の恵み（レベル30～）- 苗木ドロップボーナス
    sapling_blessing:
      base_probability: 0.15
      level_bonus: 0.005
      max_probability: 0.5
      cooldown_seconds: 0
      bonus_drops: 1            # 追加苗木数
    
    # 森の番人（レベル45～）- 木材品質向上
    forest_guardian:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.2
      cooldown_seconds: 0
      quality_multiplier: 1.8   # 品質向上倍率

  # 農家のスキル設定
  farmer:
    # 豊穣の恵み（レベル10～）- 作物追加ドロップ
    harvest_blessing:
      base_probability: 0.12
      level_bonus: 0.004
      max_probability: 0.4
      cooldown_seconds: 0
      bonus_yield_rate: 0.5     # 追加収穫率
    
    # 双子の奇跡（レベル15～）- 動物繁殖時双子確率
    twin_miracle:
      base_probability: 0.1
      level_bonus: 0.003
      max_probability: 0.25
      cooldown_seconds: 0
      effect_duration: 600      # 効果持続時間（秒）
    
    # 成長促進（レベル30～）- 作物・動物成長加速
    growth_acceleration:
      base_probability: 0.2
      level_bonus: 0.005
      max_probability: 0.6
      cooldown_seconds: 0
      acceleration_rate: 0.25   # 成長加速率（25%）
    
    # 品種改良（レベル50～）- 高品質作物・動物
    selective_breeding:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.15
      cooldown_seconds: 0
      quality_bonus: 2.0        # 品質ボーナス倍率

  # 漁師のスキル設定
  fisherman:
    # 大物釣り（レベル20～）- 大型魚釣り確率向上
    big_catch:
      base_probability: 0.08
      level_bonus: 0.003
      max_probability: 0.3
      cooldown_seconds: 0
      size_multiplier: 1.5      # サイズ倍率
    
    # 宝探し（レベル35～）- 宝物釣り確率向上
    treasure_hunter:
      base_probability: 0.05
      level_bonus: 0.002
      max_probability: 0.2
      cooldown_seconds: 0
      treasure_rate: 1.8        # 宝物確率倍率
    
    # 海の加護（レベル50～）- 天候無視釣り
    sea_blessing:
      base_probability: 1.0     # 常時発動
      level_bonus: 0.0
      max_probability: 1.0
      cooldown_seconds: 0
      weather_immunity: true    # 天候影響無効

  # 鍛冶屋のスキル設定  
  blacksmith:
    # 完璧な修理（レベル10～）- 修理時耐久度ボーナス
    perfect_repair:
