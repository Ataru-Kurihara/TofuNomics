# TofuNomics 補助設定: 職業・スキル・レベリング
# このファイルはサーバー固有データを含まないため、デプロイ時に上書き可能です。
    # 設定例:
    # atms:
    #   - world: "world_name"
    #     x: 0
    #     y: 65
    #     z: 0
    #     name: "商店街ATM"
    #   - world: "world_name"
    #     x: 100
    #     y: 70
    #     z: 100
    #     name: "住宅街ATM"

# 職業システム設定
jobs:
  # 職業の基本設定
  general:
    # プレイヤーが同時に持てる職業数
    max_jobs_per_player: 1
    # 転職時のレベル保持（true: 保持, false: リセット）
    keep_level_on_change: true
    # 職業変更のクールダウン時間（秒）。0で制限なし、86400で1日1回
    job_change_cooldown: 0
    # 上級職業: 初回就職では選べず、いずれかの職業でレベル50に到達した後に解禁される
    advanced_jobs:
      - "alchemist"
      - "enchanter"
      - "architect"

  # 各職業の設定
  job_settings:
    miner:
      display_name: "鉱夫"
      description: "鉱物資源と石材の供給を担当"
      max_level: 75
      base_income_multiplier: 1.0
      # レベルアップに必要な経験値倍率
      exp_multiplier: 10.0
      # 売却ボーナス（レベル1での基本ボーナス）
      base_sell_bonus: 0.05
      # 職業ガイドブック設定
      guide_book:
        enabled: true
        title: "&6&l鉱夫ガイドブック"
        author: "TofuNomics職業組合"
        pages:
          - |
            &0&l【鉱夫の仕事】

            &0鉱夫は鉱物資源と
            石材の供給を担当
            する職業です。

            採掘で経験値と
            報酬を獲得できます。
          - |
            &0&l【主な収入源】

            &8採掘した鉱石を
            &8取引所NPCで売却！

            &0・石炭/鉄が基本
            &0・金/ダイヤが高額
            &0・エメラルドも◎

            &eレベルUPで
            &e売却ボーナス増加！
          - |
            &0&l【経験値の上げ方】

            &0対象の鉱石や石を
            採掘すると職業
            経験値を獲得！

            &8■自分で掘った
            　ブロックが対象
            &8■設置した石は
            　経験値対象外

            &e掘るほど成長！
          - |
            &0&l【経験値一覧①】

            &8採掘1個あたり:

            &8■石炭鉱石 25
            &8■鉄鉱石 50
            &8■金鉱石 80
            &8■レッドストーン 30
            &8■ラピスラズリ 40
            &8■石 50
          - |
            &0&l【経験値一覧②】

            &8採掘1個あたり:

            &8■ダイヤ鉱石 200
            &8■エメラルド鉱石 200
            &8■ネザークォーツ 60
            &8■古代の残骸 500

            &e希少な鉱石ほど
            &e経験値も大量！
          - |
            &0&l【必要経験値】

            &8レベルUPに必要な
            &8累計経験値:

            &8■Lv5: 844
            &8■Lv10: 3,352
            &8■Lv25: 17,760
            &8■Lv50: 59,762
            &8■Lv75: 120,444

            &8高Lvほど経験値
            &8効率が低下します
          - |
            &0&l【職業スキル①】

            &6幸運の一撃
            &8Lv10〜 発動5〜25%
            &8ドロップ量が1.5倍

            &6鉱脈発見
            &8Lv25〜 発動8〜30%
            &8周囲3マスも採掘
          - |
            &0&l【職業スキル②】

            &6採掘の極意
            &8Lv50〜 発動10〜40%
            &8ツール耐久を
            &830%節約できる

            &eスキルはレベルUPで
            &e発動率が上昇！
          - |
            &0&l【レベルUP特典】

            &8到達報酬:
            &85レベルごとに金塊
            &8■Lv10: 80金塊
            &8■Lv25: 200金塊
            &8■Lv50: 400金塊
            &8■Lv75: 600金塊

            &8レベルに応じて
            &8称号も変化！

            &eLv50で転職可能！
          - |
            &0&l【稼ぐコツ】

            &8■まず石炭と鉄を
            　集めて売ろう
            &8■ツルハシの耐久
            　に注意
            &8■ダイヤ/エメラルド
            　は特に高経験値
            &8■洞窟や廃坑が
            　おすすめ
          - |
            &0&l【便利なコマンド】

            &0/jobs stats
            &8→ 職業の統計情報

            &0/jobs info
            &8→ 職業の詳細

            &0/jobs guide
            &8→ この本を再取得
      
