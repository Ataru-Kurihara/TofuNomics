# TofuNomics 補助設定: 遊び方ガイド（/guide）
# このファイルはサーバー固有データを含まないため、デプロイ時に上書き可能です。
#
# /guide でメニューを開き、項目を押すとその本（pages）を画面に開きます（本は配りません）。
# /guide <項目のID> で、その項目の本を直接開けます（例: /guide money）。
# - slot: メニュー（27マス）での位置。22（職業一覧）と 26（閉じる）は使えません
# - icon: メニューに出すアイテム（Material 名）
# - description: メニューのアイコンに出す説明
# - pages: 本のページ。1ページは 14 行・1 行は全角 12 文字までに収める（GuideTopicTest で検査）
# 色コードは & を使います。本の地の色が白なので、文字は &0（黒）などの濃い色にします。
guide:
  author: "TofuNomics"
  topics:
    start:
      name: "&a&lはじめに"
      icon: OAK_SAPLING
      slot: 10
      description:
        - "最初にやること"
        - "このサーバーの遊び方"
      pages:
        - |
          &0&l【はじめに】
          &0この世界では
          職業に就いて働き、
          お金を稼いで
          暮らします。

          &0&l最初の3ステップ
          &01. /jobs で
          　職業を選ぶ
          &02. 仕事をして
          　品物を集める
          &03. 取引所で売る
        - |
          &0&l【1日の流れ】
          &0NPCのお店は
          &c6:00〜22:00&0
          （ゲーム内）だけ
          開いています。

          &0夜は採掘や建築、
          朝になったら
          取引所へ売りに
          行きましょう。

          &8時刻は/clockの
          &8時計で分かります
        - |
          &0&l【困ったら】
          &0/guide で
          いつでもこの
          ガイドを開けます。

          &0・ルール
          &0・NPCの使い方
          &0・お金のしくみ
          &0・職業
          &0・家と土地
          &0・よくある質問
          &0から選べます。
    rules:
      name: "&c&lルール"
      icon: WRITABLE_BOOK
      slot: 11
      description:
        - "禁止されていること"
        - "詳しくは /rules のページ"
      pages:
        - |
          &4&l【禁止事項】

          &0&l不正行為
          &0・チートやハック
          &0・バグの悪用
          &0・不正なお金や
          　アイテムの入手
          &c→ 永久BAN

          &0&l放置での稼ぎ
          &0・AFKで経験値を
          　稼ぐこと
          &c→ 警告〜停止
        - |
          &4&l【迷惑行為】

          &0・人への嫌がらせ
          &0・暴言や差別発言
          &0・人の建物を壊す
          &0・取引での詐欺
          &c→ 警告〜一時BAN

          &0詳しいルールは
          &0/rules で開ける
          &0ページにあります。

          &2&l楽しくフェアに！
    npcs:
      name: "&e&lNPCの使い方"
      icon: VILLAGER_SPAWN_EGG
      slot: 12
      description:
        - "取引所・銀行・食料店"
        - "加工・依頼受付所"
      pages:
        - |
          &0&l【NPCの種類】
          &0街には5種類の
          NPCがいます。

          &0・取引所
          &0・銀行
          &0・食料店
          &0・加工屋
          &0・依頼受付所

          &0右クリックで
          画面が開きます。
        - |
          &0&l【取引所】
          &0集めた品を売って
          お金にします。

          &0&l総合取引所
          &0無職でも売れる。
          &0職業ボーナスなし

          &0&l職業の取引所
          &0その職業だけが
          売り買いできる。
          &0売値にボーナス
        - |
          &0&l【取引所の操作】
          &0左クリック:1個
          &0右クリック:10個
          &0シフト+クリック:
          　その品を全部
          &0全アイテム売却:
          　確認画面のあと
          　売れる品を全部

          &0職業の取引所の
          「購入モード」で
          道具も買えます。
          &c営業 6:00〜22:00
        - |
          &0&l【銀行】
          &0お金を預けたり
          引き出したり、
          両替ができます。

          &0・TofuCoin 9枚
          　= TofuGold 1個
          &0・/deposit で預金
          &0・/withdraw で
          　引き出し
          &8コマンドは銀行の
          &8近くで使えます
          &c営業 6:00〜22:00
        - |
          &0&l【食料店】
          &0食べ物を現金で
          買えます。
          &0・品ごとに1日に
          　買える数に上限
          &0・在庫は朝6時に
          　補充されます
          &0・総合食料品店は
          　何でもあるが高い

          &0職業に合う物を
          食べると経験値が
          少し増えます。
        - |
          &0&l【加工屋】
          &0原木1個を
          板材4枚にします。

          &0・料金は原木1個
          　につき1G
          &0・木こりは無料
          &0・1回64個まで
          &0・時間制限なし

          &8板材は木こりしか
          &8作れないので、
          &8ここで作ります
        - |
          &0&l【依頼受付所】
          &0モブの落とし物を
          集めて渡すと
          お金がもらえます。

          &0例: 腐肉・骨・糸
          　火薬・クモの目
          　エンダーパール

          &0・同時に5件まで
          &0・同じ依頼は
          　時間をあけて再び
          &0・職業は問わない
    money:
      name: "&6&lお金のしくみ"
      icon: GOLD_NUGGET
      slot: 13
      description:
        - "現金と預金の違い"
        - "送金・マーケット"
      pages:
        - |
          &0&l【お金の種類】
          &0単位はG（金塊）。
          &0・TofuCoin
          　金塊の見た目
          　1枚 = 1G
          &0・TofuGold
          　金インゴット
          　1個 = 9G

          &c普通の金塊や
          &c金インゴットは
          &cお金になりません
        - |
          &0&l【現金と預金】
          &0&l現金
          &0持ち物の中の
          TofuCoin/Gold。
          &0NPCでの買い物は
          現金で払います。

          &0&l預金
          &0銀行の口座の残高
          &0送金と家賃は
          主に預金から。

          &0/bal で両方見る
        - |
          &0&l【コマンド】
          &0/bal
          　現金と預金を見る
          &0/pay 名前 金額
          　預金から送金
          　（相手がいる時）
          &0/deposit 金額
          　現金を預ける
          &0/withdraw 金額
          　預金を引き出す
          &0/baltop
          　預金ランキング
        - |
          &0&l【もらえるお金】
          &0・取引所の売上
          　（現金。入らない
          　分は口座へ）
          &0・依頼の報酬
          &0・職業レベルが
          　5上がるごとの
          　報酬（口座へ）
          &0・マーケットの
          　売上（口座へ）
        - |
          &0&l【マーケット】
          &0/market で
          プレイヤー同士の
          売り買いができる。

          &0・出品: 手に持つ
          　品に値段を付ける
          &0・募集: 欲しい物
          　を前払いで募る
          &0・修理や
          　エンチャントの
          　依頼もできる
          &8売上は手数料を
          &8引いて口座へ
    jobs:
      name: "&b&l職業"
      icon: STONE_PICKAXE
      slot: 14
      description:
        - "職業の選び方と注意"
        - "稼ぎ方は職業一覧で"
      pages:
        - |
          &0&l【職業の種類】
          &0・鉱夫
          &0・木こり
          &0・農家
          &0・釣り人
          &0・鍛冶屋
          &0&l上級職
          &0・ポーション屋
          &0・エンチャンター
          &0・建築家
          &8上級職はどれかの
          &8職業でLv50に
          &8なると就けます
        - |
          &0&l【就職の注意】
          &0就ける職業は
          1つだけです。

          &c&lLv50になるまで
          &c&l辞めることも
          &c&l転職もできません

          &0/jobs で一覧を
          開き、職業を押す
          と稼ぎ方と
          ガイドブックを
          読めます。
        - |
          &0&l【経験値】
          &0職業の仕事を
          すると入ります。
          &0・初めて手に入れた
          　種類は5倍
          &0・職業に合う物を
          　食べると少し増加
          &0・自分で置いた
          　ブロックを壊す
          　と入らない

          &0Lv5ごとに
          お金の報酬！
        - |
          &0&l【職業だけの物】
          &0職業によって
          作れる物・壊せる物
          が決まっています。

          &0例:
          &0・つるはし: 鉱夫
          &0・斧と板材: 木こり
          &0・作物の収穫: 農家
          &0・防具や剣: 鍛冶屋
          &0・釣竿: 釣り人

          &8無職では作れない
    home:
      name: "&d&l家と土地"
      icon: OAK_DOOR
      slot: 15
      description:
        - "賃貸の家を借りる"
        - "農家の畑区画"
      pages:
        - |
          &0&l【賃貸の家】
          &0/housing list
          　借りられる家
          &0/housing info 番号
          　家の詳細
          &0/housing rent
          　番号 日数
          　家を借りる
          &0/housing myrentals
          　自分の契約

          &8週払い・月払いは
          &81日あたりが安い
        - |
          &0&l【家のきまり】
          &0・1人3件まで
          &0・期限の3日前に
          　お知らせが来る
          &0・延長は
          　/housing extend
          &0・解約は
          　/housing cancel
          &0・チェストは
          　借りた人だけが
          　開けられる
        - |
          &0&l【農家の畑区画】
          &0農家に就くと
          畑の区画が1つ
          もらえます。

          &0区画は守られて
          いて、ほかの人は
          作物を取れません。

          &8作物の収穫と
          &8植え付けは
          &8農家だけです
    faq:
      name: "&f&lよくある質問"
      icon: COMPASS
      slot: 16
      description:
        - "売れない・使えない"
        - "ときの確かめ方"
      pages:
        - |
          &0&l【売れない！】
          &0&lQ.取引所で断られる
          &0営業時間外か、
          その取引所の
          職業ではない。
          &0無職は
          総合取引所へ。

          &0&lQ.1個だと売れない
          &0安い品は合計が
          1G近くになるまで
          まとめて売る。
        - |
          &0&l【売れない！2】
          &0&lQ.NPCで買った品が
          &0&l売れない
          &0NPCで買った品は
          取引所で売れず、
          マーケットの
          募集にも出せない。

          &0&lQ.お金が売れない
          &0TofuCoinや
          TofuGoldは
          売り物ではない。
        - |
          &0&l【使えない！】
          &0&lQ.預金できない
          &0銀行の近くで
          /deposit を使う。

          &0&lQ.板材を作れない
          &0板材は木こりだけ
          が作れる。
          加工屋で原木を
          板材にできる。

          &0&lQ.転職できない
          &0Lv50からです。
        - |
          &0&l【使えない！2】
          &0&lQ.道具がない
          &0職業の取引所の
          購入モードで
          買える。

          &0&lQ.作物が取れない
          &0収穫は農家だけ。

          &0&lQ.鉱石が掘れない
          &0鉱石は鉱夫だけ。
          &0石や原木は
          誰でも壊せる。
