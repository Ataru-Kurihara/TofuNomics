      content:
      - §7このサーバーは経済とジョブシステムを
      - §7楽しむことができるサーバーです。
      - ''
      - §e▼ 最初にやること
      - §f1. §b/jobs §fコマンドでジョブを選ぶ
      - §f2. 選んだジョブで活動して経験値を稼ぐ
      - §f3. レベルアップして新しいスキルを習得
      - §f4. 稼いだお金を銀行に預ける
      - ''
      - §e▼ ジョブの選び方
      - §f・§b/jobs §fでジョブ一覧を確認
      - §f・自分のプレイスタイルに合ったジョブを選択
      - §f・ジョブは1日1回まで変更可能
