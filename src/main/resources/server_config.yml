          &e売却ボーナス増加！

          '
        - '&0&l【経験値の上げ方】


          &0対象の鉱石や石を

          採掘すると職業

          経験値を獲得！


          &8■自分で掘った

          　ブロックが対象

          &8■設置した石は

          　経験値対象外


          &e掘るほど成長！

          '
        - '&0&l【経験値一覧①】


          &8採掘1個あたり:


          &8■石炭鉱石 25

          &8■鉄鉱石 50

          &8■金鉱石 80

          &8■レッドストーン 30

          &8■ラピスラズリ 40

          &8■石 50

          '
        - '&0&l【経験値一覧②】


          &8採掘1個あたり:


          &8■ダイヤ鉱石 200

          &8■エメラルド鉱石 200

          &8■ネザークォーツ 60

          &8■古代の残骸 500


          &e希少な鉱石ほど

          &e経験値も大量！

          '
        - '&0&l【必要経験値】


          &8レベルUPに必要な

          &8累計経験値:


          &8■Lv5: 1,393

          &8■Lv10: 6,502

          &8■Lv25: 41,918

          &8■Lv50: 162,694

          &8■Lv100: 619,023


          &8高Lvほど経験値

          &8効率が低下します

          '
        - '&0&l【職業スキル①】


          &6幸運の一撃

          &8Lv10〜 発動5〜25%

          &8ドロップ量が1.5倍


          &6鉱脈発見

