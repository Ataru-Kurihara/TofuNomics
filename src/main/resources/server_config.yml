rules:
  enabled: false
  require_agreement: false
  url: https://to-fu.world/worlds/tofu-nomics/
  pages:
    '1':
      title: §6§l【TofuNomicsへようこそ！】
      content:
      - §7このサーバーは経済とジョブシステムを
      - §7楽しむことができるサーバーです。
      - ''
      - §e▼ 最初にやること
      - §f1. §b/jobs §fコマンドでジョブを選ぶ
      - §f2. 選んだジョブで活動して経験値を稼ぐ
      - §f3. レベルアップして新しいスキルを習得
      - §f4. 稼いだお金を銀行に預ける
      - ''
      - §e▼ ジョブの選び方
      - §f・§b/jobs §fでジョブ一覧を確認
      - §f・自分のプレイスタイルに合ったジョブを選択
      - §f・ジョブは1日1回まで変更可能
      - ''
      - §e▼ 困ったときは
      - §f・§b/rules §fでこのルールを再確認
      - §f・管理者やベテランプレイヤーに相談
    '2':
      title: §6§l【経済システム】
      content:
      - §e▼ 通貨システム
      - '§f通貨: §6金塊 (G)'
      - §f新規プレイヤーは100Gからスタート
      - ''
      - §e▼ 銀行システム
      - §f・§b/balance §f- 残高確認
      - §f・§b/deposit <金額> §f- 金塊を預ける
      - §f・§b/withdraw <金額> §f- 金塊を引き出す
      - §f・銀行NPC周辺でのみ取引可能
      - ''
      - §e▼ 送金
      - §f・§b/pay <プレイヤー名> <金額>
      - §f・他のプレイヤーにお金を送れます
      - ''
      - §e▼ NPCとの取引
      - §f・取引NPCで物を売買できます
      - §f・ジョブレベルで価格ボーナスあり
      - §f・食料NPCで食べ物を購入できます
    '3':
      title: §6§l【ジョブ・スキルシステム】
      content:
      - §e▼ ジョブの種類
      - §f・鉱夫（Miner） - 鉱石採掘で経験値
      - §f・木こり（Woodcutter） - 木の伐採で経験値
      - §f・農家（Farmer） - 作物栽培・畜産で経験値
      - §f・釣り人（Fisherman） - 釣りで経験値
      - §f・鍛冶屋（Blacksmith） - 道具・武器の生産と修理
      - §f・ポーション屋（Alchemist） - ポーション製造
      - §f・エンチャンター（Enchanter） - エンチャント付与
      - §f・建築家（Architect） - 建築と装飾で経験値
      - §f※ 同時に就けるジョブは1つのみです
      - ''
      - §e▼ レベルアップ
      - §f・ジョブ関連の作業で経験値を獲得
      - §f・レベルが上がるとスキルを習得
      - '§f・最大レベル: 100'
      - ''
      - §e▼ スキル
      - §f・各ジョブ専用のスキルが習得可能
      - §f・作業効率アップや特殊能力を獲得
      - ''
      - §e▼ ジョブ変更
      - §f・§b/jobs leave §fで現在のジョブを辞める
      - §f・§b/jobs join <ジョブ名> §fで新しいジョブに就く
      - §f・レベル50に達すると他の職業に転職できます
    '4':
      title: §c§l【禁止事項・ルール】
      content:
      - §c§l以下の行為は禁止されています
      - ''
      - §e▼ 不正行為
      - §f・チート・ハックツールの使用
      - §f・バグやグリッチの悪用
      - §f・不正な金銭・アイテム取得
      - §c→ 永久BAN
      - ''
      - §e▼ 迷惑行為
      - §f・他プレイヤーへの嫌がらせ
      - §f・暴言・差別発言
      - §f・他プレイヤーの建築物の破壊
      - §c→ 警告〜一時BAN
      - ''
      - §e▼ その他の注意事項
      - §f・他プレイヤーとの取引は慎重に
      - §f・詐欺行為は厳禁
      - §f・AFK（放置）での経験値稼ぎ禁止
      - §c→ 警告〜アカウント停止
      - ''
      - §6§l楽しく、フェアにプレイしましょう！
  messages:
    book_name: §6§lTofuNomicsルールブック
    book_given: §aルールブックを受け取りました。右クリックで確認できます。
    gui_title: §6TofuNomics サーバールール
    must_agree: §c§lルールに同意するまでプレイできません。§r§c /rules でルールを確認してください。
    agreed: §a§l✔ ルールに同意しました！§r§a 楽しいサーバーライフを送ってください！
    disagreed: §cルールに同意しませんでした。§e/rules §cでもう一度確認してください。
    action_blocked: §cルールに同意するまで、この操作はできません。§e/rules §cでルールを確認してください。
