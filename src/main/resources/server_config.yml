    - '&f職業に就くことで収入を得ることができます。'
    - '&e&l/jobs join <職業名> &rで職業に就職してみましょう！'
    - '&b利用可能な職業: &f鉱夫, 木こり, 農家, 釣り人, 鍛冶屋, ポーション屋, エンチャンター, 建築家'
